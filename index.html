<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recipes</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='%23a8572c' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 22h48a24 24 0 0 1-48 0z'/%3E%3Cpath d='M24 56h16'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fafaf8;
      --surface: #ffffff;
      --text: #1c1c1a;
      --muted: #77756f;
      --line: #e8e6e1;
      --accent: #a8572c;
      --radius: 14px;
      --sans: "Inter", system-ui, -apple-system, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413;
        --surface: #1c1c1a;
        --text: #ecebe7;
        --muted: #9a978f;
        --line: #2c2b28;
        --accent: #e0915f;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.6 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; color: inherit; }

    .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 40px 0 28px;
    }
    .brand { font: 500 24px/1 var(--sans); letter-spacing: -0.03em; color: var(--muted); transition: color .15s; }
    .brand:hover { color: var(--text); }
    .brand i { font-style: normal; color: var(--accent); }

    /* Search */
    .search {
      width: 100%; padding: 12px 16px; margin-bottom: 28px;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 999px; outline: none;
    }
    .search:focus { border-color: var(--muted); }

    /* Grid */
    .grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      padding-bottom: 64px;
    }
    .card {
      display: flex; flex-direction: column; gap: 14px;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 22px;
      transition: border-color .15s, transform .15s;
    }
    .card:hover { border-color: var(--muted); transform: translateY(-2px); }
    .icon { width: 44px; height: 44px; color: var(--accent); }
    .icon img { width: 100%; height: 100%; display: block; }
    .card h2 { font: 600 17px/1.3 var(--sans); letter-spacing: -0.01em; }
    .card p {
      color: var(--muted); font-size: 14px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .empty { color: var(--muted); text-align: center; padding: 64px 0; }

    /* Detail */
    .back { display: inline-block; color: var(--muted); font-size: 14px; margin-bottom: 28px; }
    .back:hover { color: var(--text); }
    .detail { max-width: 720px; padding-bottom: 80px; }
    .detail .icon { width: 64px; height: 64px; margin-bottom: 20px; }
    .detail h1 { font: 600 clamp(28px, 5.5vw, 38px)/1.15 var(--sans); letter-spacing: -0.03em; }
    .lede { color: var(--muted); font-size: 17px; margin-top: 12px; }
    .intro { border-bottom: 1px solid var(--line); padding-bottom: 28px; margin-bottom: 40px; }

    h3 { font: 600 18px/1.3 var(--sans); letter-spacing: -0.01em; margin-bottom: 16px; }
    h4 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 22px 0 6px; }
    section + section { margin-top: 44px; }

    .ingredients { list-style: none; }
    .ingredients li {
      display: grid; grid-template-columns: 96px 1fr; gap: 12px;
      padding: 9px 0; border-bottom: 1px solid var(--line);
    }
    .qty { color: var(--muted); font-variant-numeric: tabular-nums; }
    .note { color: var(--muted); }

    .steps { list-style: none; counter-reset: s; }
    .steps li {
      counter-increment: s; position: relative;
      padding: 0 0 18px 32px;
    }
    .steps li::before {
      content: counter(s); position: absolute; left: 0; top: 0;
      font: 500 15px/1.6 var(--sans); color: var(--accent); font-variant-numeric: tabular-nums;
    }
    .notes { color: var(--muted); white-space: pre-line; }
    .link { color: var(--accent); font-size: 14px; word-break: break-all; }
    .link:hover { text-decoration: underline; }

    /* Add to notes */
    .pill {
      display: inline-block; margin-top: 20px; padding: 8px 16px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
      font-size: 14px; transition: border-color .15s;
    }
    .pill:hover { border-color: var(--muted); }
    .shop-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
    .shop-head h3 { margin: 0; }
    .text-btn { background: none; border: 0; padding: 0; color: var(--accent); font-size: 14px; cursor: pointer; }
    .ingredients li.pick { display: block; padding: 0; }
    .pick label {
      display: grid; grid-template-columns: 18px 96px 1fr; gap: 12px; align-items: start;
      padding: 9px 0; cursor: pointer;
    }
    .pick input { width: 16px; height: 16px; margin-top: 4px; accent-color: var(--accent); cursor: pointer; }
    .shop-actions {
      position: sticky; bottom: 0; margin-top: 32px;
      padding: 16px 0 calc(16px + env(safe-area-inset-bottom));
      background: var(--bg); border-top: 1px solid var(--line);
    }
    .primary {
      width: 100%; padding: 13px; border: 0; border-radius: 999px; cursor: pointer;
      background: var(--text); color: var(--bg); font-weight: 500;
    }
    .primary:disabled { opacity: .35; cursor: default; }
    .msg { color: var(--muted); font-size: 14px; text-align: center; margin-top: 10px; }
    .msg:empty { display: none; }
    .fallback {
      display: block; width: 100%; min-height: 180px; margin-top: 24px; padding: 14px 16px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      font: inherit; color: inherit; resize: vertical; outline: none;
    }

    @media (max-width: 520px) {
      header { padding: 24px 0 18px; }
      .ingredients li { grid-template-columns: 76px 1fr; }
      .pick label { grid-template-columns: 18px 76px 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = "https://ysrvbbecbqwiuthphnfk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_8dt1fN6NAxlA3YvqjWqkxg_NeKhxay7";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

    const app = document.getElementById("app");
    let recipes = null;
    let query = "";

    // ---------- helpers ----------
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // Icons are shown as <img>, so any script inside an SVG never runs.
    // The SVGs use currentColor, which an <img> can't inherit, so swap in the accent colour first.
    function iconImg(svg) {
      if (!svg) return "";
      const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
      const src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.replaceAll("currentColor", accent));
      return `<img src="${src}" alt="" />`;
    }


    const FRACTIONS = [[1/8,"⅛"],[1/4,"¼"],[1/3,"⅓"],[1/2,"½"],[2/3,"⅔"],[3/4,"¾"]];
    // sep goes between the whole number and the fraction: "1 ½" on the page, "1½" in copied lists.
    function fmtAmount(n, sep = " ") {
      if (n == null || isNaN(n)) return "";
      const whole = Math.floor(n), frac = n - whole;
      if (frac < 0.04) return String(whole);
      if (frac > 0.96) return String(whole + 1);
      const hit = FRACTIONS.find(([v]) => Math.abs(v - frac) < 0.04);
      if (hit && n < 20) return (whole ? whole + sep : "") + hit[1];
      return String(Math.round(n * 10) / 10);
    }

    // Ingredients grouped by section in position order; a null section gets no label.
    function ingredientGroups(ingredients, row) {
      let html = "", section;
      ingredients.forEach((i, idx) => {
        if (idx === 0 || i.section !== section) {
          if (idx) html += "</ul>";
          section = i.section;
          html += (section ? `<h4>${esc(section)}</h4>` : "") + `<ul class="ingredients">`;
        }
        html += row(i, idx);
      });
      return html ? html + "</ul>" : "";
    }

    const qtyText = (i) => [i.amount != null ? fmtAmount(Number(i.amount)) : "", i.unit].filter(Boolean).join(" ");
    const nameHtml = (i) => `${esc(i.name)}${i.note ? ` <span class="note">— ${esc(i.note)}</span>` : ""}`;

    // One shopping-list line: "<amount> <unit> <name> (<note>)", skipping empty parts.
    const listLine = (i) =>
      [i.amount != null ? fmtAmount(Number(i.amount), "") : "", i.unit, i.name]
        .map((p) => String(p ?? "").trim()).filter(Boolean).join(" ") + (i.note ? ` (${i.note.trim()})` : "");

    let current = null; // last recipe loaded, so the notes screen doesn't refetch it
    async function loadRecipe(id) {
      if (current?.id === id) return current;
      const { data, error } = await db
        .from("recipes")
        .select("id,title,description,notes,icon_svg, recipe_ingredients(*), recipe_steps(*)")
        .eq("id", id)
        .maybeSingle();
      if (error) throw error;
      if (!data) throw new Error("Recipe not found.");
      data.recipe_ingredients.sort((a, b) => a.position - b.position);
      data.recipe_steps.sort((a, b) => a.position - b.position);
      return (current = data);
    }

    // ---------- views ----------
    function header() {
      return `
        <header>
          <a class="brand" href="#">recipes<i>.</i></a>
        </header>`;
    }

    async function loadRecipes() {
      if (recipes) return recipes;
      const { data, error } = await db
        .from("recipes")
        .select("id,title,description,icon_svg,created_at")
        .eq("status", "processed")
        .order("created_at", { ascending: false });
      if (error) throw error;
      return (recipes = data);
    }

    async function renderList() {
      app.innerHTML = header() + `<div class="empty">Loading…</div>`;
      let list;
      try { list = await loadRecipes(); }
      catch (e) { app.querySelector(".empty").textContent = e.message; return; }

      app.innerHTML = header() + `
        <input class="search" id="q" type="search" placeholder="Search recipes" value="${esc(query)}" />
        <div class="grid" id="grid"></div>`;

      const grid = document.getElementById("grid");
      const draw = () => {
        const q = query.toLowerCase();
        const shown = list.filter((r) =>
          !q || (r.title || "").toLowerCase().includes(q) || (r.description || "").toLowerCase().includes(q));
        grid.innerHTML = shown.length ? shown.map((r) => {
          return `
            <a class="card" href="#/r/${r.id}">
              <div class="icon">${iconImg(r.icon_svg)}</div>
              <h2>${esc(r.title || "Untitled")}</h2>
              ${r.description ? `<p>${esc(r.description)}</p>` : ""}
            </a>`;
        }).join("") : `<div class="empty" style="grid-column:1/-1">No recipes found.</div>`;
      };
      const input = document.getElementById("q");
      input.oninput = () => { query = input.value; draw(); };
      draw();
    }

    async function renderDetail(id) {
      app.innerHTML = header() + `<div class="empty">Loading…</div>`;
      let r;
      try { r = await loadRecipe(id); }
      catch (e) {
        app.querySelector(".empty").innerHTML = `${esc(e.message)} <a class="link" href="#">Back</a>`;
        return;
      }

      const ingredients = r.recipe_ingredients;
      const steps = r.recipe_steps;
      // Notes may record where a recipe came from ("Source: …"); keep that off the site.
      const notes = (r.notes || "").split("\n").filter((l) => !/^\s*source\s*:/i.test(l)).join("\n").trim();

      app.innerHTML = header() + `
        <article class="detail">
          <a class="back" href="#">← All recipes</a>
          <div class="intro">
            <div class="icon">${iconImg(r.icon_svg)}</div>
            <h1>${esc(r.title || "Untitled")}</h1>
            ${r.description ? `<p class="lede">${esc(r.description)}</p>` : ""}
            ${ingredients.length ? `<a class="pill" href="#/r/${r.id}/shop">Add to notes</a>` : ""}
          </div>
          ${ingredients.length ? `<section><h3>Ingredients</h3>${ingredientGroups(ingredients, (i) =>
            `<li><span class="qty">${esc(qtyText(i))}</span><span>${nameHtml(i)}</span></li>`)}</section>` : ""}
          ${steps.length ? `<section><h3>Method</h3><ol class="steps">${steps.map((s) => `<li>${esc(s.instruction)}</li>`).join("")}</ol></section>` : ""}
          ${notes ? `<section><h3>Notes</h3><p class="notes">${esc(notes)}</p></section>` : ""}
        </article>`;
      window.scrollTo(0, 0);
    }

    // "What are you missing?" — tick ingredients, then share the list (e.g. to Apple Notes).
    async function renderShop(id) {
      app.innerHTML = header() + `<div class="empty">Loading…</div>`;
      let r;
      try { r = await loadRecipe(id); }
      catch (e) {
        app.querySelector(".empty").innerHTML = `${esc(e.message)} <a class="link" href="#">Back</a>`;
        return;
      }
      const ingredients = r.recipe_ingredients;
      const title = r.title || "Untitled";

      app.innerHTML = header() + `
        <article class="detail">
          <a class="back" href="#/r/${r.id}">← ${esc(title)}</a>
          <div class="intro">
            <h1>What are you missing?</h1>
            <p class="lede">Tick what you need to buy.</p>
          </div>
          <div class="shop-head">
            <h3>Ingredients</h3>
            <button class="text-btn" id="toggle" type="button">Select all</button>
          </div>
          ${ingredientGroups(ingredients, (i, idx) => `
            <li class="pick"><label>
              <input type="checkbox" data-i="${idx}" />
              <span class="qty">${esc(qtyText(i))}</span>
              <span>${nameHtml(i)}</span>
            </label></li>`)}
          <textarea class="fallback" id="fallback" readonly hidden></textarea>
          <div class="shop-actions">
            <button class="primary" id="copy" type="button" disabled>Copy list (0)</button>
            <p class="msg" id="msg" role="status"></p>
          </div>
        </article>`;
      window.scrollTo(0, 0);

      const boxes = [...app.querySelectorAll(".pick input")];
      const toggle = document.getElementById("toggle");
      const copy = document.getElementById("copy");
      const msg = document.getElementById("msg");
      const fallback = document.getElementById("fallback");
      const picked = () => boxes.filter((b) => b.checked).map((b) => ingredients[b.dataset.i]);

      const update = () => {
        const n = picked().length;
        copy.textContent = `Copy list (${n})`;
        copy.disabled = n === 0;
        toggle.textContent = n === boxes.length ? "Clear" : "Select all";
      };
      boxes.forEach((b) => (b.onchange = update));
      toggle.onclick = () => {
        const all = picked().length !== boxes.length;
        boxes.forEach((b) => (b.checked = all));
        update();
      };

      let msgTimer;
      const flash = (text) => {
        msg.textContent = text;
        clearTimeout(msgTimer);
        msgTimer = setTimeout(() => (msg.textContent = ""), 3000);
      };

      copy.onclick = async () => {
        const text = [`Shopping list: ${title}`, ...picked().map(listLine)].join("\n");
        fallback.hidden = true;
        // 1. Share sheet (pick Notes on iOS). Closing the sheet is not an error.
        if (navigator.share) {
          try { await navigator.share({ text }); return; }
          catch (e) { if (e.name === "AbortError") return; }
        }
        // 2. Clipboard.
        try {
          await navigator.clipboard.writeText(text);
          flash("Copied to clipboard");
          return;
        } catch {}
        // 3. Selectable text.
        fallback.value = text;
        fallback.hidden = false;
        fallback.focus();
        fallback.select();
        flash("Couldn't copy automatically. Select the text above and copy it.");
      };
    }

    // ---------- routing ----------
    function route() {
      const m = location.hash.match(/^#\/r\/([\w-]+)(\/shop)?$/);
      if (!m) return renderList();
      m[2] ? renderShop(m[1]) : renderDetail(m[1]);
    }

    window.addEventListener("hashchange", route);
    route();
  </script>
</body>
</html>
